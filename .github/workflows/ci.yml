name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff lint
        # Pinned: bare `uvx ruff` floats to the newest release, and a new minor
        # can widen the default rule set. This repo ships no [tool.ruff] config,
        # so it relies on those defaults -- an unpinned ruff turns an unrelated
        # upstream release into a red build on unchanged code.
        run: uvx ruff@0.15.12 check reaper_mcp_server.py test_server_contracts.py test_connection.py

      - name: Offline contract tests
        run: >
          uv run --with mcp --with httpx --with pytest --with pytest-asyncio
          python -m pytest test_server_contracts.py -q

      - name: pip-audit (resolved dependency tree)
        run: uv run --with mcp --with httpx --with pip-audit pip-audit

  security-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security regression guard
        run: bash scripts/security_guard.sh
